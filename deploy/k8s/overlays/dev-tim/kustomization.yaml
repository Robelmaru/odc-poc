apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tim's development overlay. The odc-poc-dev-tim Argo CD Application points its
# source `path` here and auto-syncs on every change to the `Development-Tim` branch.
namespace: odc-poc-dev-tim

resources:
  - ../../base

# STOPGAP: pinned to the CI-built commit SHA. By design this should read
# `newTag: development-tim` and Argo CD Image Updater would write the live digest
# back here on each build (configured in argocd/applications-development-tim.yaml).
# That write-back has never run, so the rendered manifest never changed and Argo
# never rolled out new images. Pinning the SHA gives Argo a real diff to sync.
# Revert to `newTag: development-tim` once Image Updater is confirmed working.
images:
  - name: ghcr.io/dc-bar-web/odc-poc
    newTag: 99b53c8267c64620c8b02f4732d1ec01dac4186d

patches:
  - target:
      kind: Ingress
      name: odc-poc
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: odc-document-analyzer-dev-tim.dcbar.org
      - op: replace
        path: /spec/rules/0/host
        value: odc-document-analyzer-dev-tim.dcbar.org
      - op: replace
        path: /spec/tls/0/secretName
        value: odc-poc-tls

  # Single replica for a dev environment; always re-pull the image.
  # imagePullPolicy: Always is belt-and-suspenders: while the image is pinned to an
  # immutable SHA tag (or a digest via Image Updater) the reference already forces a
  # fresh pull, so this only matters if the overlay ever tracks the mutable
  # :development-tim tag again. Scoped to this overlay so SHA-pinned staging/prod keep
  # the default IfNotPresent (no extra registry pull on every pod start).
  - target:
      kind: Deployment
      name: odc-poc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
