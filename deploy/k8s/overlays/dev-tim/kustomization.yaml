apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tim's development overlay. The odc-poc-dev-tim Argo CD Application points its
# source `path` here and auto-syncs on every change to the `Development-Tim` branch.
namespace: odc-poc-dev-tim

resources:
  - ../../base

# CI-managed image tag. .github/workflows/build-image.yml rewrites newTag to the
# just-built commit SHA on every push to Development-Tim and commits it back here;
# Argo CD then reconciles this overlay onto the cluster. This file is the source of
# truth for what is deployed to dev-tim — do not hand-edit newTag, CI overwrites it.
# (The write-back touches only deploy/**, which build-image.yml path-ignores, so it
# cannot trigger another build.)
images:
  - name: ghcr.io/dc-bar-web/odc-poc
    newTag: 0100e84db43a3cf86e3cfc86568fea9472159797

patches:
  - target:
      kind: Ingress
      name: odc-poc
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: odc-document-analyzer-dev-tim.dcbar.org
      - op: replace
        path: /spec/rules/0/host
        value: odc-document-analyzer-dev-tim.dcbar.org
      - op: replace
        path: /spec/tls/0/secretName
        value: odc-poc-tls
      # Stream large uploads straight to the pod instead of buffering the whole
      # request body in nginx first — lets the timeline route flush its SSE
      # response immediately so the upstream LB sees a first byte right away and
      # doesn't time out the connection mid-upload (ERR_CONNECTION_TIMED_OUT).
      # proxy-buffering off keeps the SSE event stream flowing unbuffered too.
      # (dev-tim only for now; promote to base if it resolves large uploads.)
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1proxy-request-buffering
        value: "off"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1proxy-buffering
        value: "off"

  # Single replica for a dev environment; always re-pull the image.
  # imagePullPolicy: Always is belt-and-suspenders: while the image is pinned to an
  # immutable SHA tag (or a digest via Image Updater) the reference already forces a
  # fresh pull, so this only matters if the overlay ever tracks the mutable
  # :development-tim tag again. Scoped to this overlay so SHA-pinned staging/prod keep
  # the default IfNotPresent (no extra registry pull on every pod start).
  - target:
      kind: Deployment
      name: odc-poc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # Big-document headroom (dev-tim only). Large PDFs (e.g. a ~500 MB scanned
  # binder) are buffered whole in memory and parsed by pdf-parse, whose working
  # set is several times the file size — this OOM-kills the base 4Gi pod and the
  # browser sees "Failed to fetch". Locally the same upload succeeds only because
  # a dev machine has far more RAM and no V8 heap cap. Match that here: raise the
  # memory limit and the --max-old-space-size heap so the deployed pod can process
  # documents of the size staff actually upload. (Strategic-merge, keyed on the
  # container/env names, so it survives env-list reordering. Scoped to dev-tim;
  # staging/prod keep the base 4Gi until sized deliberately. Requires a node with
  # this much RAM free — if the pod stays Pending, the cluster lacks capacity.)
  - target:
      kind: Deployment
      name: odc-poc
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odc-poc
      spec:
        template:
          spec:
            containers:
              - name: app
                resources:
                  requests:
                    memory: "2Gi"
                  limits:
                    memory: "12Gi"
                env:
                  # 8 GB JS heap, leaving ~4 GB under the 12Gi limit for the
                  # off-heap upload buffer + pdf.js typed arrays.
                  - name: NODE_OPTIONS
                    value: "--max-old-space-size=8192"
