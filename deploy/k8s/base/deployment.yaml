apiVersion: apps/v1
kind: Deployment
metadata:
  name: odc-poc
  labels:
    app: odc-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odc-poc
  template:
    metadata:
      labels:
        app: odc-poc
    spec:
      imagePullSecrets:
        - name: ghcr-pull # image-pull secret for ghcr.io, created out-of-band (see ../../README.md)
      containers:
        - name: app
          # TAG is set per environment by each overlay's `images:` entry (kustomize),
          # bumped to the built commit SHA by the promotion PR.
          image: ghcr.io/robelmaru/odc-poc:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: odc-poc-secrets # manually-managed K8s Secret: DATABASE_URL, ANTHROPIC_API_KEY, ENTRA_*, GPTZERO_API_KEY, PIN_* (see ../../README.md)
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
