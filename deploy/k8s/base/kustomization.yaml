apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-agnostic base. Overlays under ../overlays/<env> reference this
# directory and layer on namespace, image tag (commit SHA), hostname, and scaling.
# Argo CD points its `path` at an overlay, never at this base directly.

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - migrate-job.yaml
