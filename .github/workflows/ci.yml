name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest

    # Integration tests run against a real PostgreSQL + pgvector (per the testing
    # standard) — a throwaway service container, migrated before the tests run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odc_poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/odc_poc_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/odc_poc_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test (with coverage thresholds)
        run: npm run test:coverage
