apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doc-analyzer
  labels:
    app: doc-analyzer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev-doc-analyzer.dcbar.org
      secretName: dev-doc-analyzer
  rules:
    - host: dev-doc-analyzer.dcbar.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doc-analyzer
                port:
                  number: 80