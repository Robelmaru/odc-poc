apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dcbar-docanalyzer-dev-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: "dcbar-docanalyzer-dev-kv"
    tenantId: "89df4ea7-2a11-4867-8a15-e2e6102deb04"
    objects: |
      array:
        # PostgreSQL/pgvector connection string incl. password (DATABASE_URL) - read by
        # the API at startup for every query and by the Drizzle migration run.
        - |
          objectName: database-url
          objectType: secret
        # Anthropic Claude API key (ANTHROPIC_API_KEY) - read by the API for document
        # analysis, Q&A, timeline, translation and AI-detection fallback.
        - |
          objectName: anthropic-api-key
          objectType: secret
        # GPTZero API key (GPTZERO_API_KEY) - read by the API's /api/ai-detect route for
        # AI-text detection; the route falls back to Claude when it is absent.
        - |
          objectName: gptzero-api-key
          objectType: secret
        # Microsoft Entra ID app-registration client secret (ENTRA_CLIENT_SECRET) - read
        # by the API's /auth callback to exchange the OAuth code for staff SSO tokens.
        - |
          objectName: entra-client-secret
          objectType: secret