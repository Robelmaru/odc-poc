apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-analyzer
spec:
  template:
    spec:
      containers:
        - name: doc-analyzer
          volumeMounts:
            - name: kv-secret
              mountPath: /mnt/secrets
              readOnly: true
            - name: doc-analyzer-production-storage
              mountPath: /data
      volumes:
        - name: kv-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dcbar-docanalyze-prod-kv
            nodePublishSecretRef:
              name: secrets-store-creds
        - name: doc-analyzer-production-storage
          persistentVolumeClaim:
            claimName: doc-analyzer-production-storage