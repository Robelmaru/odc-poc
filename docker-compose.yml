services:
  app:
    image: dcbar/odc-poc-app:latest
    ports:
      - "3001:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_PATH=/app/backend/data/odc-poc.db
      - PIN_CATERINA=1111
      - PIN_ABESHA=2222
      - PIN_ROBEL=3333
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
