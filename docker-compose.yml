services:
  app:
    image: dcbar/odc-poc-app:latest
    ports:
      - "3001:3000"
    environment:
      # Secrets/config are read from the environment / local .env — never hardcoded.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # PostgreSQL runs on a dedicated server (not in compose, per the standard).
      # Point this at it; staging/prod append ?sslmode=require.
      - DATABASE_URL=${DATABASE_URL}
      - PIN_CATERINA=${PIN_CATERINA}
      - PIN_ABESHA=${PIN_ABESHA}
      - PIN_ROBEL=${PIN_ROBEL}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    # Give long-running OCR / multi-pass jobs time to drain on stop (OPS-007).
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
