services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: odc_poc_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odc_poc_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dcbar/odc-poc-app:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/odc_poc_dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      PIN_CATERINA: ${PIN_CATERINA:-}
      PIN_ABESHA: ${PIN_ABESHA:-}
      PIN_ROBEL: ${PIN_ROBEL:-}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    command: >-
      sh -c "node --env-file=.env --import=tsx src/migrate.ts && node --env-file=.env --import=tsx src/index.ts"
    # Give long-running OCR / multi-pass jobs time to drain on stop (OPS-007).
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
