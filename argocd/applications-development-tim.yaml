# Argo CD Application — odc-poc (Development-Tim)
#
# Register once with the cluster's Argo CD:
#   kubectl apply -n argocd -f argocd/applications-development-tim.yaml
#
# Auto-syncs from the `Development-Tim` branch's overlay, mirroring staging. Image
# bumps come from CI: .github/workflows/build-image.yml writes the just-built commit
# SHA into the overlay's newTag on every push and commits it back, and this app
# reconciles it. We do NOT use Argo CD Image Updater — it isn't installed in the
# cluster; the CI write-back replaces it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odc-poc-dev-tim
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DC-Bar-web/odc-poc.git
    targetRevision: Development-Tim
    path: deploy/k8s/overlays/dev-tim
  destination:
    server: https://kubernetes.default.svc
    namespace: odc-poc-dev-tim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
